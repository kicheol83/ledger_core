<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 900" width="780" height="900" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <style>
      .bg { fill: #eaeee4; }
      .panel { fill: #f4f6ef; stroke: #c1cbb7; }
      .panel-gen { fill: #f0ece2; stroke: #b9b096; stroke-dasharray: 4 3; }
      .hdr { fill: #16211c; font-size: 15px; font-weight: 600; letter-spacing: 0.04em; }
      .sub { fill: #16211c; font-size: 13px; font-weight: 600; }
      .item { fill: #4b5a51; font-size: 12px; }
      .note { fill: #7d8a80; font-size: 11px; }
      .rule { stroke: #c1cbb7; stroke-width: 1; }
      .rule-strong { stroke: #9aa791; stroke-width: 1; }
      .debit { fill: #1b4d3e; }
      .credit { fill: #94272a; }
      .cmd { fill: #16211c; font-size: 11.5px; }
      .arrow { stroke: #9aa791; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa791"/>
    </marker>
  </defs>

  <rect class="bg" width="780" height="900"/>

  <rect x="0" y="0" width="780" height="52" fill="#f4f6ef"/>
  <line class="rule-strong" x1="0" y1="52" x2="780" y2="52"/>
  <rect class="debit" x="28" y="20" width="8" height="14"/>
  <line class="rule-strong" x1="40" y1="16" x2="40" y2="38"/>
  <rect class="credit" x="44" y="20" width="8" height="14"/>
  <text class="hdr" x="64" y="32">Authored by hand vs generated by a tool</text>

  <rect class="panel" x="24" y="76" width="352" height="470" rx="5"/>
  <rect class="debit" x="24" y="76" width="4" height="470"/>
  <text class="sub" x="44" y="100">Written by hand — 159 files</text>
  <text class="note" x="44" y="118">all committed</text>
  <line class="rule" x1="44" y1="128" x2="360" y2="128"/>

  <text class="item" x="44" y="150">root config          13</text>
  <text class="note" x="250" y="150">package.json, tsconfig…</text>
  <text class="item" x="44" y="172">.github/              3</text>
  <text class="item" x="44" y="194">.husky/               2</text>
  <text class="note" x="250" y="194">chmod +x needed</text>
  <text class="item" x="44" y="216">docker/               2</text>
  <text class="item" x="44" y="238">db/                  15</text>
  <text class="note" x="250" y="238">7 migrations, 2 seeds</text>
  <text class="item" x="44" y="260">apps/api/            79</text>
  <text class="note" x="250" y="260">4 modules + shared</text>
  <text class="item" x="44" y="282">apps/web/            24</text>
  <text class="item" x="44" y="304">docs/                14</text>
  <text class="note" x="250" y="304">7 ADRs, 3 diagrams</text>
  <text class="item" x="44" y="326">load-tests/           6</text>

  <line class="rule" x1="44" y1="348" x2="360" y2="348"/>
  <text class="note" x="44" y="370">Two of these look generated but are not:</text>
  <text class="item" x="44" y="392">.env.test</text>
  <text class="note" x="150" y="392">committed — CI must match local</text>
  <text class="item" x="44" y="414">db/migrations/*</text>
  <text class="note" x="180" y="414">created by a command,</text>
  <text class="note" x="180" y="430">then edited and committed</text>

  <line class="rule" x1="44" y1="450" x2="360" y2="450"/>
  <text class="note" x="44" y="472">Filenames that must not change:</text>
  <text class="item" x="44" y="494">migration timestamp prefixes</text>
  <text class="note" x="44" y="512">they decide the order the schema is built in</text>
  <text class="item" x="44" y="532">.husky/commit-msg · pre-commit</text>

  <rect class="panel-gen" x="404" y="76" width="352" height="470" rx="5"/>
  <rect class="credit" x="404" y="76" width="4" height="470"/>
  <text class="sub" x="424" y="100">Made by a tool — never typed</text>
  <text class="note" x="424" y="118">only one of these is committed</text>
  <line class="rule" x1="424" y1="128" x2="740" y2="128"/>

  <text class="cmd" x="424" y="152">pnpm install</text>
  <text class="item" x="440" y="172">node_modules/</text>
  <text class="note" x="620" y="172">ignored</text>
  <text class="item" x="440" y="192">pnpm-lock.yaml</text>
  <text class="note" x="608" y="192">COMMITTED</text>
  <text class="item" x="440" y="212">.husky/_/</text>
  <text class="note" x="620" y="212">ignored</text>

  <text class="cmd" x="424" y="244">cp .env.example .env</text>
  <text class="item" x="440" y="264">.env</text>
  <text class="note" x="620" y="264">ignored</text>

  <text class="cmd" x="424" y="296">make up</text>
  <text class="item" x="440" y="316">ledgercore_pg_data</text>
  <text class="note" x="596" y="316">docker volume</text>
  <text class="item" x="440" y="336">ledgercore_redis_data</text>
  <text class="note" x="596" y="336">docker volume</text>

  <text class="cmd" x="424" y="368">pnpm migrate</text>
  <text class="item" x="440" y="388">pgmigrations table</text>
  <text class="note" x="596" y="388">in the database</text>

  <text class="cmd" x="424" y="420">pnpm build</text>
  <text class="item" x="440" y="440">apps/api/dist/</text>
  <text class="item" x="440" y="460">apps/web/dist/</text>
  <text class="item" x="440" y="480">*.tsbuildinfo</text>
  <text class="note" x="620" y="460">all ignored</text>

  <text class="cmd" x="424" y="512">pnpm migrate:create X</text>
  <text class="item" x="440" y="532">a new timestamped .sql</text>

  <rect class="panel" x="24" y="574" width="732" height="300" rx="5"/>
  <text class="sub" x="44" y="600">Order matters — each step needs the one before it</text>
  <line class="rule" x1="44" y1="610" x2="740" y2="610"/>

  <text class="cmd" x="60" y="640">1  bash bootstrap.sh</text>
  <text class="note" x="300" y="640">directories only</text>

  <text class="cmd" x="60" y="672">2  place the 159 files</text>
  <text class="note" x="300" y="672">see SETUP.md</text>

  <text class="cmd" x="60" y="704">3  chmod +x .husky/*</text>
  <text class="note" x="300" y="704">copy-paste loses the execute bit</text>

  <text class="cmd" x="60" y="736">4  cp .env.example .env</text>
  <text class="note" x="300" y="736">before install — husky reads it</text>

  <text class="cmd" x="60" y="768">5  git init &amp;&amp; pnpm install</text>
  <text class="note" x="300" y="768">git first: husky needs a repo to hook into</text>

  <text class="cmd" x="60" y="800">6  make up</text>
  <text class="note" x="300" y="800">init/*.sql runs ONLY on an empty volume</text>

  <text class="cmd" x="60" y="832">7  pnpm migrate</text>
  <text class="note" x="300" y="832">then seed the system accounts</text>

  <text class="cmd" x="60" y="864">8  pnpm test</text>
  <text class="note" x="300" y="864">the point of all of it</text>

  <path class="arrow" d="M46,632 L46,858"/>
</svg>
