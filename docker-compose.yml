name: ledgercore

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgercore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ledgercore}
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=en-US --encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/postgresql.dev.conf:/etc/postgresql/postgresql.conf:ro
    command: ['postgres', '-c', 'config_file=/etc/postgresql/postgresql.conf']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ledger} -d ${POSTGRES_DB:-ledgercore}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ledgercore-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  webhook-sink:
    image: caddy:2-alpine
    container_name: ledgercore-webhook-sink
    restart: unless-stopped
    command: ['caddy', 'respond', '--listen', ':8080', 'ok']
    ports:
      - '${WEBHOOK_SINK_PORT:-8080}:8080'

volumes:
  pg_data:
    name: ledgercore_pg_data
  redis_data:
    name: ledgercore_redis_data
